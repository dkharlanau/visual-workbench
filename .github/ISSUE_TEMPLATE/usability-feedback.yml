name: External usability feedback
description: Report a privacy-safe 15-minute first-use session for Visual Workbench.
title: "Usability: "
labels:
  - usability
body:
  - type: markdown
    attributes:
      value: Use only synthetic or intentionally public details. Do not include client processes, internal systems, URLs, credentials, screenshots, or proprietary diagrams.
  - type: input
    id: release
    attributes:
      label: Release or commit tested
      placeholder: v0.1.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and Node.js version
    validations:
      required: true
  - type: dropdown
    id: completed
    attributes:
      label: Completed within 15 minutes
      options:
        - "Yes"
        - "No"
    validations:
      required: true
  - type: textarea
    id: blocker
    attributes:
      label: First blocker or confusing step
    validations:
      required: true
  - type: textarea
    id: interpretation
    attributes:
      label: What did the rendered view make clear or hide?
    validations:
      required: true
  - type: textarea
    id: improvement
    attributes:
      label: Most useful improvement
    validations:
      required: true
